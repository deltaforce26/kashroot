[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kashroot"
version = "0.1.0"
description = "Kashroot — kosher restaurant discovery. Data-integrity backend (FastAPI + PostgreSQL/PostGIS)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
kashroot = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path()-in-default-argument idiom is correct, idiomatic
# usage (the callable is a sentinel FastAPI's dependency-injection system recognizes
# at declaration time, not a mutable default) — silence B008 for these rather than
# contorting endpoint signatures. File() is included because it is actually used the
# same way in app/api/admin.py.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true