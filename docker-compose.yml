services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kashroot
      POSTGRES_PASSWORD: kashroot
      POSTGRES_DB: kashroot
    ports:
      - "5432:5432"
    volumes:
      - kashroot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kashroot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  kashroot_pgdata:
