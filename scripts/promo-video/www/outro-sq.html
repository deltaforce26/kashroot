<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>outro-sq</title><link rel="stylesheet" href="/base-sq.css">
<style>
.lead{top:70px;font-weight:600;font-size:44px}
.qr{top:150px}.qr .card{display:inline-block;background:#fff;border-radius:32px;padding:26px;box-shadow:0 16px 50px rgba(22,22,22,.10)}
.qr img{display:block;width:440px;height:440px}
.url{top:690px;font-weight:700;font-size:86px;direction:ltr;letter-spacing:-1px}
.chag{top:810px;font-weight:600;font-size:66px;color:var(--green)}
.hint{top:920px;font-weight:400;font-size:32px;color:var(--muted)}
.mark{position:absolute;left:0;width:1080px;top:990px;text-align:center;direction:ltr}
.mark img{width:56px;height:56px;border-radius:14px;vertical-align:middle}
.mark span{font-weight:700;font-size:30px;display:inline-block;vertical-align:middle;margin-left:14px}
</style></head><body>
<div class="stack lead">סורקים ומגדירים את הסטנדרט שלכם</div>
<div class="stack qr"><div class="card"><img src="/qr.png" alt="QR"></div></div>
<div class="stack url a d1">kashroot.app</div>
<div class="stack chag serif a d2">חג שמח</div>
<div class="stack hint a d3">כשרות לפי הסטנדרט שלך · חול המועד סוכות תשפ״ז</div>
<div class="mark a d3"><img src="/icons/icon.svg" alt=""><span>Kashroot</span></div>
</body></html>
