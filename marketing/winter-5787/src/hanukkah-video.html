<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kashroot — חנוכה תשפ״ז · video (1080×1920, 15s)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="hanukkah.css">
<style>
.canvas{width:1080px;height:1920px}
.hl{position:absolute;left:70px;right:70px;top:130px;text-align:center;opacity:0}
.hl h1{margin:0;font:700 76px/1.16 Assistant,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.hl .sub{font-size:31px;color:var(--sub);margin-top:18px;font-weight:500;line-height:1.35}
/* beat 1: the hanukkiah alone, centred */
.hkbeat{position:absolute;left:50%;top:500px;width:700px;margin-left:-350px;opacity:0}
.hkbeat .hk{width:700px;height:auto}
.phonewrap{position:absolute;left:50%;top:470px;width:418px;height:872px;margin-left:-209px;opacity:0}
.phonewrap .device{position:absolute;inset:0;transform:scale(1.2);transform-origin:top center}
.scr{position:absolute;inset:0;opacity:0}
.scr .shot{opacity:0}
.scr .shot.base{opacity:1}
.chip{position:absolute;left:50%;top:392px;transform:translateX(-50%);opacity:0;white-space:nowrap}
.caption{position:absolute;left:0;right:0;top:1580px;text-align:center;font:700 40px/1 Assistant,sans-serif;letter-spacing:-.02em;direction:ltr;color:var(--ink);opacity:0}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 80px;opacity:0;z-index:3}
.end .hk{width:340px;height:auto;margin-bottom:6px}
.end .brand{gap:10px}
.end .wordmark{font-size:112px}
.end h1{margin:48px 0 0;font:700 74px/1.18 Assistant,sans-serif;text-align:center;color:var(--ink);letter-spacing:-.01em}
.end .url{margin-top:46px;font:700 112px/1 Assistant,sans-serif;letter-spacing:-.035em;direction:ltr;color:var(--ink)}
.end .qr{margin-top:40px}
.end .cta{margin-top:30px;font-size:40px;font-weight:700;color:var(--green)}
.end .small{margin-top:14px;font-size:26px;color:var(--sub)}
.end>*{opacity:0}
/* square cut overrides */
body.sq .canvas{width:1080px;height:1080px}
body.sq .hl{top:62px}
body.sq .hl h1{font-size:56px}
body.sq .hl .sub{font-size:25px;margin-top:10px}
body.sq .hkbeat{top:300px;width:560px;margin-left:-280px}
body.sq .hkbeat .hk{width:560px}
body.sq .chip{top:236px;font-size:26px;padding:8px 20px 9px 18px}
body.sq .phonewrap{top:300px;height:0}
body.sq .phonewrap .device{transform:scale(.78)}
body.sq .caption{top:1008px;font-size:32px}
body.sq .end .hk{width:170px;margin-bottom:0}
body.sq .end .wordmark{font-size:72px}
body.sq .end .mark{width:80px;height:80px}
body.sq .end h1{font-size:46px;margin-top:14px}
body.sq .end .url{font-size:70px;margin-top:14px}
body.sq .end .qr{margin-top:14px;width:172px!important;height:172px!important}
body.sq .end .cta{font-size:28px;margin-top:12px}
body.sq .end .small{font-size:19px;margin-top:6px}
body.sq .leaf.b{display:none}
</style>
</head>
<body>
<div class="canvas hk-canvas" id="c"></div>
<script src="screens.js"></script>
<script src="hanukkah.js"></script>
<script>
// Copy is final (CAMPAIGN.md / brief). Beat 1 has no phone; beats 2–4 are three people,
// three real profiles, three real home lists (src/screens/hanukkah/, see CAPTURE.md there).
const beats = [
  { h: 'שמונה לילות.<br>שמונה סטנדרטים.', s: 'לכל אחד בשולחן הסטנדרט שלו' },
  { h: 'לסבא יש סטנדרט', s: 'בד״ץ העדה החרדית — ורק הוא', chip: 'סבא' },
  { h: 'לגיסה יש סטנדרט אחר', s: 'בית יוסף — ורק הוא', chip: 'הגיסה' },
  { h: 'ולבן הדוד — כל תעודה', s: 'כל אחד מקבל תשובה. אף אחד לא מקבל ציון.', chip: 'בן הדוד' },
];
const screens = [
  K.shot('hanukkah/certifiers-p1.png', 's1a', 'base') + K.shot('hanukkah/home-p1.png', 's1b'),
  K.shot('hanukkah/certifiers-p2.png', 's2a', 'base') + K.shot('hanukkah/home-p2.png', 's2b'),
  K.shot('hanukkah/preset-p3.png', 's3a', 'base') + K.shot('hanukkah/home-p3.png', 's3b'),
];

document.getElementById('c').innerHTML = `
${K.leaf({ w: 460, x: -170, y: 1560, rot: -8, op: .36, cls: 'b' })}
${K.leaf({ w: 380, x: 820, y: 1620, rot: 60, flip: true, op: .24, cls: 'b' })}
${beats.map((b, i) => `<div class="hl" id="hl${i}"><h1>${b.h}</h1><div class="sub">${b.s}</div></div>`).join('')}
<div class="hkbeat" id="hkbeat">${K.hanukkiah({ w: 840, id: 'hk1' })}</div>
${beats.slice(1).map((b, i) => K.chip(b.chip, 'chip' + (i + 1))).join('')}
<div class="phonewrap" id="pw">${K.phone(screens.map((s, i) => `<div class="scr" id="scr${i + 1}">${s}</div>`).join(''))}</div>
<div class="caption" id="cap">kashroot.app</div>
<div class="end" id="end">
  ${K.hanukkiah({ w: 380, id: 'hk2' })}
  <div class="brand">${K.MARK(130, 'm1')}<div class="wordmark">Kashroot</div></div>
  <h1>חנוכה שמח.<br>הסטנדרט שלכם, התשובה שלנו.</h1>
  <div class="url">kashroot.app</div>
  ${K.qr('qr-hanukkah-video.svg', 250)}
  <div class="cta">הצטרפו עכשיו</div>
  <div class="small">כשרות לפי הסטנדרט שלך · חנוכה תשפ״ז</div>
</div>`;

// ---------- timeline (all Web Animations, paused; window.seek(ms) scrubs) ----------
const anims = [];
const EASE = 'cubic-bezier(.2,.7,.2,1)';
function A(el, kf, opts) { const a = el.animate(kf, Object.assign({ fill: 'both', easing: EASE }, opts)); a.pause(); anims.push(a); return a; }
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const BEAT = 3000, X = 300;

// headlines: in at start, out over the last 300 ms of the beat (later beats overlap the previous exit)
for (let i = 0; i < 4; i++) {
  const st = i * BEAT, en = st + BEAT;
  const hl = $('#hl' + i);
  const inAt = i === 0 ? -X : st - 200;
  A(hl, [{ opacity: 0, transform: 'translateY(22px)' }, { opacity: 1, transform: 'translateY(0)' }], { delay: inAt, duration: X });
  A(hl, [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-14px)' }], { delay: en - X, duration: X, fill: 'forwards' });
}

// beat 1: the hanukkiah rises in, then its flames light one after another — the shamash first,
// then the eight, left to right. Every lit flame is the same size and brightness.
A($('#hkbeat'), [{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'translateY(0)' }], { delay: -X, duration: 500 });
A($('#hkbeat'), [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-16px)' }], { delay: BEAT - X, duration: X, fill: 'forwards' });
{
  const flames = $$('#hk1 .flame');
  const order = [flames.find(f => f.classList.contains('shamash')), ...flames.filter(f => !f.classList.contains('shamash'))];
  order.forEach((f, k) => {
    const at = k === 0 ? 250 : 560 + (k - 1) * 215; // last one at ~2.07 s, lit by 2.4 s
    A(f, [{ opacity: 0, transform: 'scale(.15)' }, { opacity: 1, transform: 'scale(1.06)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }], { delay: at, duration: 340 });
  });
}

// phone: in with beat 2, gentle float, out with the end of beat 4
A($('#pw'), [{ opacity: 0 }, { opacity: 1 }], { delay: BEAT - 200, duration: X });
A($('#pw'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-12px)' }, { transform: 'translateY(0)' }], { duration: 4000, iterations: Infinity, easing: 'ease-in-out' });
A($('#pw .device'), [{ opacity: 1, transform: 'scale(1.2)' }, { opacity: 0, transform: 'scale(1.14)' }], { delay: 4 * BEAT - X, duration: X, fill: 'forwards' });
A($('#cap'), [{ opacity: 0 }, { opacity: .85 }], { delay: BEAT - 200, duration: X });
A($('#cap'), [{ opacity: .85 }, { opacity: 0 }], { delay: 4 * BEAT - X, duration: X, fill: 'forwards' });

// beats 2–4: chip + screen stack per person; the picker/preset crossfades to that person's home list
for (let i = 1; i <= 3; i++) {
  const st = i * BEAT, en = st + BEAT;
  const scr = $('#scr' + i), chip = $('#chip' + i);
  A(scr, [{ opacity: 0, transform: 'translateX(-18px)' }, { opacity: 1, transform: 'translateX(0)' }], { delay: st - 200, duration: X });
  if (i < 3) A(scr, [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: 'translateX(18px)' }], { delay: en - X, duration: X, fill: 'forwards' });
  A(chip, [{ opacity: 0, transform: 'translateX(-50%) translateY(10px)' }, { opacity: 1, transform: 'translateX(-50%) translateY(0)' }], { delay: st - 150, duration: X });
  A(chip, [{ opacity: 1, transform: 'translateX(-50%) translateY(0)' }, { opacity: 0, transform: 'translateX(-50%) translateY(-8px)' }], { delay: en - X, duration: X, fill: 'forwards' });
  A($(`#s${i}b`), [{ opacity: 0 }, { opacity: 1 }], { delay: st + 1300, duration: 450 });
}

// beat 5: end card
A($('#end'), [{ opacity: 0 }, { opacity: 1 }], { delay: 4 * BEAT - 250, duration: 350 });
$$('#end > *').forEach((el, i) => A(el, [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'translateY(0)' }], { delay: 4 * BEAT - 200 + i * 120, duration: 450 }));

window.seek = (ms) => { anims.forEach(a => { a.currentTime = ms; }); };
window.setSquare = () => { document.body.classList.add('sq'); };
window.seek(0);
</script>
</body>
</html>
