<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kashroot — חנוכה תשפ״ז (1080×1080)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="hanukkah.css">
<style>
.canvas{width:1080px;height:1080px}
.canvas.hk-canvas{background:
  radial-gradient(30% 24% at 16% 8%,rgba(230,189,94,.30) 0%,rgba(230,189,94,0) 70%),
  radial-gradient(80% 60% at 0% 100%,rgba(160,200,170,.18) 0%,rgba(160,200,170,0) 60%),
  var(--paper)}
.layout{position:absolute;inset:0;display:flex;padding:54px 60px 50px 40px;gap:10px}
.text{width:600px;flex:none;display:flex;flex-direction:column;align-items:flex-start;text-align:right;position:relative;z-index:2}
.phonecol{flex:1;position:relative}
.phonecol .device{position:absolute;left:-14px;top:124px;transform:rotate(-6deg) scale(.86);transform-origin:center}
.hkwrap{position:absolute;left:52px;top:4px;z-index:1;opacity:.92}
.brand{align-items:flex-start;gap:6px;margin-bottom:34px}
.brand .mark{margin-right:6px;margin-bottom:4px}
.wordmark{font-size:92px}
.tagline{font-size:30px;margin-top:4px}
h1{margin:0;font:700 52px/1.16 Assistant,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.subline{font-size:25px;color:var(--sub);margin:16px 0 36px;font-weight:500}
.feats{display:flex;flex-direction:column;gap:22px}
.bottom{margin-top:auto;display:flex;align-items:center;gap:34px;width:100%}
.bottom .url{font:700 60px/1 Assistant,sans-serif;letter-spacing:-.03em;direction:ltr;color:var(--ink)}
.bottom .cta{font-size:28px;color:#3a3a3a;margin-top:10px;font-weight:600}
.bottom .qr{margin-right:4px}
</style>
</head>
<body>
<div class="canvas hk-canvas" id="c"></div>
<script src="screens.js"></script>
<script src="hanukkah.js"></script>
<script>
document.getElementById('c').innerHTML = `
${K.leaf({ w: 420, x: -140, y: 790, rot: -8, op: .4 })}
${K.leaf({ w: 260, x: 880, y: 900, rot: 60, flip: true, op: .22 })}
<div class="hkwrap">${K.hanukkiah({ w: 230, id: 'hk1' })}</div>
<div class="layout">
  <div class="text">
    <div class="brand">${K.MARK(118, 'm1')}<div class="wordmark">Kashroot</div><div class="tagline">כשרות לפי הסטנדרט שלך</div></div>
    <h1>שמונה לילות בחוץ.<br>לכל אחד הסטנדרט שלו.</h1>
    <div class="subline">חנוכה תשפ״ז · ולכולם יש תשובה, לא ציון</div>
    <div class="feats">${K.HFEATURES.join('')}</div>
    <div class="bottom">
      <div><div class="url">kashroot.app</div><div class="cta">הצטרפו עכשיו</div></div>
      ${K.qr('qr-hanukkah-image.svg', 190)}
    </div>
  </div>
  <div class="phonecol">${K.phone(K.shot('hanukkah/home-p1.png'))}</div>
</div>`;
</script>
</body>
</html>
